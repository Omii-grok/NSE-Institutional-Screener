name: 📈 NSE Daily Bhavcopy Updater

# ──────────────────────────────────────────────────────────────
# TRIGGERS
# ──────────────────────────────────────────────────────────────
on:
  # Auto-run every weekday at 7:00 PM IST (13:30 UTC)
  schedule:
    - cron: '30 13 * * 1-5'

  # Manual trigger from GitHub → Actions tab → Run workflow button
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────
# PERMISSIONS  ← Critical: allows the action to push to the repo
# ──────────────────────────────────────────────────────────────
permissions:
  contents: write

# ──────────────────────────────────────────────────────────────
# JOB
# ──────────────────────────────────────────────────────────────
jobs:
  fetch-and-commit:
    name: Download NSE CSV & Commit
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the full repo
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Python 3.11
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install only what fetch_daily.py needs
      - name: 📦 Install dependencies
        run: pip install requests pytz

      # 4. Run the downloader — exits 0 on success, 1 on failure
      - name: 📥 Download latest NSE Bhavcopy
        run: python fetch_daily.py

      # 5. Commit and push the updated CSV (only if it changed)
      - name: 💾 Commit & push updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sec_bhavdata_full.csv

          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "✅ CSV unchanged — nothing to commit"
          else
            git commit -m "📊 Auto-update NSE bhavcopy [$(date +'%Y-%m-%d %H:%M IST' --date='TZ=\"Asia/Kolkata\" now')]"
            git push
            echo "✅ CSV updated and pushed to GitHub"
          fi