name: Daily NSE Bhavcopy Fetch
on:
  schedule:
    - cron: '30 13 * * 1-5'   # 7:00 PM IST (13:30 UTC), Monday–Friday
  workflow_dispatch:            # Also allows manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Download NSE Bhavcopy
        run: python fetch_daily.py

      - name: Commit & push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add sec_bhavdata_full.csv || true
          git diff --staged --quiet || git commit -m "Auto: NSE data $(date +'%Y-%m-%d')"
          git push
